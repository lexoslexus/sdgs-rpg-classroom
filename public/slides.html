<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SDGs 環境教育課前簡報</title><style>*{box-sizing:border-box}body{margin:0;color:#243047;font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:#eaf5ef}.deck{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:28px 0}.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;padding:12px 0;background:rgba(234,245,239,.92);backdrop-filter:blur(10px)}.toolbar a,.toolbar button{min-height:42px;border:1px solid #d8e4df;border-radius:8px;padding:0 14px;color:#16724b;background:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}.slide{min-height:640px;margin:20px 0;padding:clamp(28px,5vw,56px);border:1px solid #d8e4df;border-radius:8px;background:#fff;box-shadow:0 18px 50px rgba(31,53,71,.12);break-after:page}.hero{display:grid;align-content:center;background:linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.92)),url("https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1600&q=80");background-size:cover}.badge{display:inline-block;width:fit-content;padding:6px 10px;border-radius:8px;color:#fff;background:#16724b;font-weight:900}h1{margin:14px 0;font-size:clamp(44px,7vw,78px);line-height:1.04}h2{margin:12px 0 18px;color:#16724b;font-size:clamp(30px,4vw,48px)}p,li{font-size:20px;line-height:1.7}.question-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.question{border:1px solid #d8e4df;border-radius:8px;padding:14px;background:#f8fbf9}.question strong{color:#2d8fe0}.answer{margin-top:8px;color:#16724b;font-weight:900}@media(max-width:760px){.question-grid{grid-template-columns:1fr}.slide{min-height:auto}}@media print{body{background:#fff}.deck{width:auto;padding:0}.toolbar{display:none}.slide{min-height:100vh;margin:0;border:0;box-shadow:none;border-radius:0}}</style></head><body><main class="deck"><div class="toolbar"><a href="/">回到遊戲</a><button onclick="window.print()">列印 / 另存 PDF</button></div><section class="slide hero"><span class="badge">六年級社會領域</span><h1>SDGs 環境教育<br>課前簡報</h1><p>用 50 題情境題，帶學生先理解永續發展、公共參與與環境行動，再進入闖關遊戲。</p></section><section class="slide"><span class="badge">學習目標</span><h2>今天要學會的三件事</h2><ol><li>能說明 SDGs 和日常生活、校園、社區環境的關係。</li><li>能判斷面對環境問題時，哪些行動較符合公民參與與永續精神。</li><li>能根據資料與情境，提出可執行的改善方案。</li></ol></section><div id="slides"></div></main><script src="/questions.js"></script><script>const groups=[["永續生活與責任消費",["SDG 12","循環經濟","塑膠減量","綠色採購","碳足跡","食農教育"]],["水、海洋與陸域生態",["SDG 6","SDG 14","SDG 15","水資源","水循環","森林保育","海岸管理","河川治理","生態服務"]],["氣候、能源與城市韌性",["SDG 7","SDG 11","SDG 13","空氣品質","防災","能源","校園能源","永續交通"]],["公平、公共參與與資料判讀",["公共參與","環境正義","SDG 1","SDG 4","SDG 5","SDG 10","SDG 16","資料判讀","媒體識讀","公共財"]],["行動方案與地方永續",["SDG 17","公民行動","社區觀察","地方創生","環境影響評估","環境倫理","永續行動方案","地方"]]];function renderQuestion(q,i){return `<article class="question"><strong>${i+1}. ${q.area}</strong><p>${q.question}</p><div class="answer">關鍵答案：${q.options[q.answer]}</div></article>`}function loadSlides(){const questions=window.SDGS_QUESTIONS||[];const used=new Set();const deck=document.querySelector('#slides');groups.forEach(([title,keywords],groupIndex)=>{const matched=questions.filter(q=>{const hit=keywords.some(k=>q.area.includes(k));if(hit)used.add(q.question);return hit});deck.insertAdjacentHTML('beforeend',`<section class="slide"><span class="badge">單元 ${groupIndex+1}</span><h2>${title}</h2><div class="question-grid">${matched.map(renderQuestion).join('')}</div></section>`)});const remaining=questions.filter(q=>!used.has(q.question));if(remaining.length){deck.insertAdjacentHTML('beforeend',`<section class="slide"><span class="badge">補充題組</span><h2>其他重要概念</h2><div class="question-grid">${remaining.map(renderQuestion).join('')}</div></section>`)}}loadSlides();</script></body></html>
