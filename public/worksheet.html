<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SDGs 個別補強學習單</title><style>body{margin:0;color:#1f2a3d;font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:#eef6f1}main{width:min(900px,calc(100% - 32px));margin:24px auto;border-radius:8px;background:#fff;padding:28px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}a,button{min-height:44px;border:1px solid #d9e2dd;border-radius:8px;padding:0 18px;color:#16724b;background:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}button{color:#fff;background:#16724b}h1{margin:0 0 8px;font-size:30px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 24px}.summary div,.item{border:1px solid #d9e2dd;border-radius:8px}.summary div{padding:10px}.item{break-inside:avoid;margin:14px 0;padding:18px}.tag{display:inline-block;padding:4px 8px;border-radius:8px;color:#fff;background:#2d8fe0;font-weight:900}h2{margin:12px 0;font-size:20px}p{line-height:1.6}.write-box{min-height:96px;margin-top:12px;padding:10px;border:1px dashed #9db3aa;border-radius:8px}.write-box.short{min-height:72px}@media print{body{background:#fff}main{width:auto;margin:0;padding:0}.toolbar{display:none}}</style></head><body><main><div class="toolbar"><a href="/">回到遊戲</a><button onclick="window.print()">列印 / 另存 PDF</button></div><div id="worksheet"></div></main><script>function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function formatMode(mode){return mode==='duel'?'兩人對戰':'單人闖關'}function renderItem(answer,index){return `<section class="item"><div class="tag">${escapeHtml(answer.area||'待加強概念')}</div><h2>${index+1}. ${escapeHtml(answer.question)}</h2><p><strong>你的答案：</strong>${escapeHtml(answer.selected)}</p><p><strong>正確觀念：</strong>${escapeHtml(answer.correctAnswer)}</p><p><strong>重點提醒：</strong>${escapeHtml(answer.explain)}</p><div class="write-box"><p>我重新整理後的想法：</p></div><div class="write-box short"><p>我可以採取的一個永續行動：</p></div></section>`}function render(){const raw=localStorage.getItem('sdgsLastRecord');const root=document.querySelector('#worksheet');if(!raw){root.innerHTML='<h1>尚未產生學習單</h1><p>請先完成一次闖關，結算後再開啟個別學習單。</p>';return}const record=JSON.parse(raw);const wrongAnswers=(record.answers||[]).filter(answer=>!answer.correct);const focusItems=wrongAnswers.length?wrongAnswers:[{area:'進階挑戰',question:'本次闖關表現良好，請選一個 SDGs 主題，設計一個可以在班級執行的一週行動。',selected:'本次無明顯錯題',correctAnswer:'能提出具體、可執行、可檢核的行動方案',explain:'高分學生可進一步練習把知識轉化為公共參與行動。'}];root.innerHTML=`<h1>SDGs 個別補強學習單</h1><p>${escapeHtml(record.player)}，以下依照本次闖關答題狀況產生，請針對不夠精熟的內容重新整理。</p><div class="summary"><div><strong>模式</strong><br>${formatMode(record.mode)}</div><div><strong>分數</strong><br>${escapeHtml(record.score)} 分</div><div><strong>答對</strong><br>${escapeHtml(record.correct)} / ${escapeHtml(record.total)} 題</div><div><strong>時間</strong><br>${escapeHtml(record.seconds)} 秒</div></div>${focusItems.map(renderItem).join('')}`;}render();</script></body></html>
