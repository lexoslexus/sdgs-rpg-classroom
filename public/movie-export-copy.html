<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP4 Export</title><style>body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#edf7ff;color:#243047}main{width:min(980px,calc(100% - 28px));margin:20px auto}button{min-height:42px;padding:0 14px;border:0;border-radius:8px;background:#16724b;color:#fff;font-weight:900;cursor:pointer}#copyButton{display:none;background:#2d8fe0}canvas,video{display:block;width:100%;max-width:960px;aspect-ratio:16/9;border:4px solid #243047;border-radius:8px;background:#8bdcff}.meter{height:14px;max-width:960px;margin:10px 0;background:#dce6f0;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#39a96b,#2d8fe0,#ffd35d)}#preview{display:none}</style></head><body><main><h1>SDGs 動漫教學影片 MP4 匯出</h1><button id="startButton">開始產生 MP4</button> <button id="copyButton">複製 MP4 資料</button> <strong id="statusText">尚未開始</strong><canvas id="movieCanvas" width="1280" height="720"></canvas><div class="meter"><div class="bar" id="bar"></div></div><video id="preview" controls></video></main><script>
const scenes=[["0:00 第一幕","彩虹能源失蹤事件","求救！","糟了，永續島的彩虹能源變暗了！","放學後，小勇者阿永聽見平板傳來求救聲。島上的海洋、城市、森林都失去光芒，只有懂得 SDGs 的孩子能重新點亮它。"],["0:30 第二幕","海龜阿藍的瓶子迷宮","啪！","阿永，幫我把海上的塑膠怪移開！","阿永遇見海龜阿藍，被寶特瓶和吸管圍住。阿永想起減塑、回收和淨灘行動，第一顆水之光終於亮了起來。"],["1:00 第三幕","熱呼呼的灰色城市","咻！","這座城市太熱了，大家都快沒力氣了！","阿永選擇步行友善道路、公園綠地和大眾運輸，讓城市慢慢降溫。"],["1:30 第四幕","亂買魔王的閃亮商店","停！","買越多就越厲害嗎？先等一下！","真正的勇者會先想需要不需要、能不能重複使用、是不是耐用。"],["2:00 第五幕","高溫火球來襲","轟！","節能和調適，要一起出招！","阿永帶同學關燈節電、補水休息、增加遮蔭，也提醒大家看高溫警示。"],["2:30 第六幕","沉默的森林精靈","亮！","沒有昆蟲和濕地，森林會失去聲音。","森林能儲碳，濕地能調節水分，授粉昆蟲能幫植物結果。"],["3:00 第七幕","看不見的居民心聲","聽！","永續，也要聽見每個人的需要。","公共問題要公開資訊、一起討論，才會公平。"],["3:30 第八幕","謠言黑霧的陷阱","破！","別急著轉傳，先查證！","阿永檢查時間、單位、來源，發現是假消息。資料判讀讓黑霧消散。"],["4:00 第九幕","最後的行動卷軸","成！","只有計畫，才能讓願望成真。","校園減塑任務要有目標、分工、時間表和檢核方式。"],["4:30 完結篇","換你成為永續小勇者","GO！","接下來，輪到你闖關了！","請用故事裡的線索，守護海洋、城市、森林和我們的未來。"]];
const canvas=document.querySelector('#movieCanvas'),ctx=canvas.getContext('2d'),bar=document.querySelector('#bar'),statusText=document.querySelector('#statusText'),startButton=document.querySelector('#startButton'),copyButton=document.querySelector('#copyButton'),preview=document.querySelector('#preview');let lastBase64='',lastMime='';const totalSeconds=300,fps=6;const wait=ms=>new Promise(r=>setTimeout(r,ms));function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}function wrap(text,x,y,mw,lh){let line='';for(const ch of [...text]){const test=line+ch;if(ctx.measureText(test).width>mw&&line){ctx.fillText(line,x,y);line=ch;y+=lh}else line=test}if(line)ctx.fillText(line,x,y)}function draw(t){const i=Math.min(Math.floor(t/30),scenes.length-1),s=scenes[i],local=t%30;const grad=ctx.createLinearGradient(0,0,0,720);grad.addColorStop(0,'#8bdcff');grad.addColorStop(.55,'#dcf8ff');grad.addColorStop(.77,'#80d873');grad.addColorStop(1,'#8a542c');ctx.fillStyle=grad;ctx.fillRect(0,0,1280,720);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;for(let x=-80;x<1400;x+=46){ctx.beginPath();ctx.moveTo(640,250);ctx.lineTo(x+local*2,-20);ctx.stroke()}ctx.fillStyle='#ffd35d';ctx.beginPath();ctx.arc(1128,104,56+Math.sin(t*4)*5,0,Math.PI*2);ctx.fill();[[55,110,330,270,'危機！',s[1]],[455,88,370,300,'出招！',s[3]],[890,112,330,268,'成功！',s[4].slice(0,24)]].forEach(p=>{const[x,y,w,h,l,b]=p;ctx.fillStyle='rgba(255,255,255,.78)';rr(x,y,w,h,8);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#243047';ctx.stroke();ctx.fillStyle='#fff06a';rr(x+18,y+18,118,46,6);ctx.fill();ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#111';ctx.font='700 20px Microsoft JhengHei';ctx.fillText(l,x+28,y+48);ctx.font='700 25px Microsoft JhengHei';wrap(b,x+24,y+h-72,w-48,34)});const hop=Math.sin(t*6)*10;ctx.fillStyle='#3b7beb';rr(142,382+hop,92,130,12);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#ffd7a8';ctx.beginPath();ctx.arc(188,438+hop,32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#243047';ctx.font='900 28px Microsoft JhengHei';ctx.fillText('永',173,448+hop);ctx.fillStyle='#ef5a48';rr(148,352+hop,80,34,8);ctx.fill();ctx.fillStyle='#fff06a';ctx.beginPath();ctx.arc(1096,130,72+Math.sin(t*4)*8,0,Math.PI*2);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#243047';ctx.stroke();ctx.fillStyle='#243047';ctx.font='900 34px Microsoft JhengHei';ctx.fillText(s[2],1048,142);ctx.fillStyle='rgba(255,255,255,.94)';rr(300,402,660,84,8);ctx.fill();ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#111';ctx.font='900 28px Microsoft JhengHei';wrap(s[3],320,454,620,34);ctx.fillStyle='rgba(255,255,255,.96)';rr(72,542,1136,132,8);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(36,48,71,.5)';ctx.stroke();ctx.fillStyle='#16724b';rr(96,562,150,36,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 18px Microsoft JhengHei';ctx.fillText(s[0],106,586);ctx.fillStyle='#111';ctx.font='900 34px Microsoft JhengHei';ctx.fillText(s[1],266,586);ctx.font='24px Microsoft JhengHei';wrap(s[4],96,638,1060,32)}
async function start(){startButton.disabled=true;copyButton.style.display='none';lastBase64='';const types=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];const mimeType=types.find(t=>MediaRecorder.isTypeSupported(t));if(!mimeType){statusText.textContent='瀏覽器不支援錄製';return}lastMime=mimeType;const chunks=[];const recorder=new MediaRecorder(canvas.captureStream(fps),{mimeType,videoBitsPerSecond:500000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.start(1000);const started=performance.now();for(;;){const elapsed=Math.min((performance.now()-started)/1000,totalSeconds);draw(elapsed);const pct=elapsed/totalSeconds*100;bar.style.width=pct+'%';statusText.textContent='正在產生：'+Math.floor(pct)+'%';if(elapsed>=totalSeconds)break;await wait(1000/fps)}recorder.stop();await new Promise(r=>recorder.onstop=r);const blob=new Blob(chunks,{type:mimeType});preview.src=URL.createObjectURL(blob);preview.style.display='block';const reader=new FileReader();reader.onload=()=>{lastBase64=reader.result.split(',')[1];statusText.textContent='完成：'+mimeType;copyButton.style.display='inline-block';startButton.disabled=false};reader.readAsDataURL(blob)}copyButton.onclick=async()=>{await navigator.clipboard.writeText(lastMime+'\n'+lastBase64);statusText.textContent='已複製 MP4 資料'};startButton.onclick=start;draw(0);
